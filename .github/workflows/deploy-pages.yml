name: Deploy to GitHub Pages

# Сборка и публикация при каждом коммите в master (и main — на случай смены ветки по умолчанию)
#
# ВАЖНО: перед первым запуском нужно один раз включить Pages в репозитории:
# Settings → Pages → Build and deployment → Source → «GitHub Actions».
# Без этого шаг «Setup Pages» упадёт с ошибкой «HttpError: Not Found»
# (Getting Pages site failed...). Включить Pages сам workflow не может:
# API требует токен с правами администратора, GITHUB_TOKEN их не имеет.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
